name: Simulated visitors

# Every hour, a batch of simulated visitors goes through the demo shop, and
# what they did is appended to the logs on the `logs` branch.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      visits:
        description: "Number of visits"
        default: "25"

permissions:
  contents: write

concurrency:
  group: visitors
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check that the shop sends data to Dynatrace
        id: tag
        run: |
          # Without the RUM tag, or the shop not online, Dynatrace would not see the visits: skip.
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          if grep -q "add site/rum-tag.html" docs/index.html; then
            echo "No Dynatrace RUM tag in the shop yet: no visits."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! curl -fsS "$site" | grep -q "Skyward"; then
            # Not published yet (Settings > Pages: main, /docs): no visits.
            echo "The shop is not online at $site yet: no visits."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.tag.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        if: steps.tag.outputs.ready == 'true'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Visit the shop
        if: steps.tag.outputs.ready == 'true'
        env:
          QUIET: "1"
        run: |
          node sim/visit.mjs \
            --site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            --visits "${{ github.event.inputs.visits || '25' }}" \
            --log run.jsonl
      - name: Append to the logs branch
        if: steps.tag.outputs.ready == 'true'
        run: |
          git config user.name "demo-shop-visitors"
          git config user.email "demo-shop-visitors@users.noreply.github.com"
          day=$(date -u +%F)
          for attempt in 1 2 3; do
            rm -rf logbook
            if git fetch -q origin logs; then
              git worktree add -q logbook FETCH_HEAD
            else
              git worktree add -q --orphan -b logs logbook
            fi
            mkdir -p logbook/logs
            cat run.jsonl >> "logbook/logs/$day.jsonl"
            (cd logbook && git add logs && git commit -qm "Visits $(date -u +%FT%H:%MZ)" && git push -q origin HEAD:logs) && break
            git worktree remove --force logbook
            sleep $((attempt * 10))
          done
